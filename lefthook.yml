pre-commit:
  commands:
    biome:
      root: "mobile/"
      glob: "*.{ts,tsx,js,mjs,cjs,json}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
pre-push:
  commands:
    verify:
      # No `root`: lefthook would keep only the push's files under mobile/ and skip a watch-, link- or page-only push.
      glob:
        - "watch/**"
        - "link/**"
        - "app/**"
        - "mobile/**"
      run: pnpm --dir mobile verify
